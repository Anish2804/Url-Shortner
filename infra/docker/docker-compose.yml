# Mirror of root docker-compose.yml for infra/ directory navigation
# Run from repository root: docker compose -f infra/docker/docker-compose.yml up -d
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: url_shortener_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-url_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretPgPassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-url_shortener}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-url_admin} -d ${POSTGRES_DB:-url_shortener}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform_network

  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - platform_network

  kafka:
    image: bashj79/kafka-kraft:latest
    container_name: url_shortener_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KRAFT_CONTAINER_HOST_NAME: kafka
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: "url-clicks:3:1,url-clicks-dlq:3:1"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform_network

  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    container_name: url_shortener_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - APP_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-url_admin}:${POSTGRES_PASSWORD:-SuperSecretPgPassword2026!}@postgres:5432/${POSTGRES_DB:-url_shortener}
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_CLICKS=url-clicks
      - KAFKA_TOPIC_DLQ=url-clicks-dlq
      - SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - IP_HASH_SALT=another_random_salt_for_ip_hmac_production_standard_32_bytes
      - BASE_URL=http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - platform_network

  worker:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker
    container_name: url_shortener_worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-url_admin}:${POSTGRES_PASSWORD:-SuperSecretPgPassword2026!}@postgres:5432/${POSTGRES_DB:-url_shortener}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_CLICKS=url-clicks
      - KAFKA_TOPIC_DLQ=url-clicks-dlq
      - SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - IP_HASH_SALT=another_random_salt_for_ip_hmac_production_standard_32_bytes
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - platform_network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: url_shortener_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - platform_network

  grafana:
    image: grafana/grafana:10.4.1
    container_name: url_shortener_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - platform_network

networks:
  platform_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
