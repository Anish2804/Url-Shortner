global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "prometheus-alerts.yml"

scrape_configs:
  - job_name: "url-shortener-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "url-shortener-api"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
