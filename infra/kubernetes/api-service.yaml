apiVersion: v1
kind: Service
metadata:
  name: url-shortener-api-service
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener-api
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: url-shortener-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
