apiVersion: v1
kind: ConfigMap
metadata:
  name: url-shortener-config
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  APP_PORT: "8000"
  BASE_URL: "https://short.example.com"
  REDIS_URL: "redis://redis-master.url-shortener.svc.cluster.local:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.url-shortener.svc.cluster.local:9092"
  KAFKA_TOPIC_CLICKS: "url-clicks"
  KAFKA_TOPIC_DLQ: "url-clicks-dlq"
  CACHE_DEFAULT_TTL: "86400"
  CACHE_NULL_TTL: "60"
  RATE_LIMIT_GLOBAL_PER_MINUTE: "120"
  RATE_LIMIT_ANONYMOUS_PER_MINUTE: "30"
  RATE_LIMIT_AUTHENTICATED_PER_MINUTE: "300"
