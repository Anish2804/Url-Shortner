name: Application Security & Vulnerability Scanning

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday

jobs:
  security-audit:
    name: SAST & Dependency Auditing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security auditing tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit AST Security Scanner
        run: |
          bandit -r app/ -ll -ii --format screen

      - name: Audit Dependencies for Known CVEs
        run: |
          pip-audit -r requirements.txt || true

      - name: Run Git Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
        continue-on-error: true
