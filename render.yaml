services:
  - type: web
    name: linkscale-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        fromService:
          type: web
          name: linkscale-api
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: linkscale-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: RATE_LIMIT_ANONYMOUS_RPM
        value: 120
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: linkscale-db
    plan: free
    region: oregon
    databaseName: linkscale
    user: linkscale_user
